<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Mistlog interaction reference (M2). Open this file in a browser. Match its behaviour, not its code. -->
<style>body { margin: 0; } [hidden] { display: none !important; }</style>
<title>Mistlog Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: Mist's flat, typographic shell. Three columns divided by hairlines (nav / page / side panel);
   at phone width one column, with the nav as a drawer and the side panel as a full-screen sheet. */
:root {
  --ink: #1a1a1a;
  --paper: #fafafa;
  --surface: #ffffff;
  --muted: #8a8a8a;
  --soft: #5c5c5c;
  --border: #e5e5e5;
  --guide: #ececec;
  --chartreuse: #b5e636;
  --coral: #e8564a;
  --canary: #ffe014;
  --on-accent: #1a1a1a;
  --select: rgba(181, 230, 54, 0.35);
  --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  --font-serif: Georgia, "Times New Roman", ui-serif, serif;
}
@supports (color: color(display-p3 1 1 1)) {
  :root {
    --chartreuse: color(display-p3 0.71 0.9 0.21);
    --coral: color(display-p3 0.91 0.34 0.29);
    --canary: color(display-p3 1 0.9 0.04);
  }
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #e5e5e5; --paper: #111111; --surface: #161616; --muted: #777777; --soft: #a5a5a5;
    --border: #2a2a2a; --guide: #242424; --select: rgba(181, 230, 54, 0.22); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #e5e5e5; --paper: #111111; --surface: #161616; --muted: #777777; --soft: #a5a5a5;
  --border: #2a2a2a; --guide: #242424; --select: rgba(181, 230, 54, 0.22); color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible, input:focus-visible, .title:focus-visible {
  outline: 2px solid var(--chartreuse); outline-offset: 1px;
}
.mono { font-family: var(--font-mono); }
.label {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- Stage and app grid ---------- */
.stage { height: 100%; display: flex; justify-content: center; }
.stage.framed {
  align-items: center;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--guide);
}
.app {
  --lw: 232px; --rw: 400px;
  position: relative; display: grid; width: 100%; height: 100%;
  grid-template-columns: var(--lw) minmax(0, 1fr) var(--rw);
  background: var(--paper); overflow: hidden;
}
.app.left-closed { --lw: 0px; }
.app.right-closed { --rw: 0px; }
.app.framed { width: 390px; height: min(820px, 100%); border: 1px solid var(--ink); }

/* ---------- Left nav ---------- */
.left {
  border-right: 1px solid var(--border); display: flex; flex-direction: column; min-width: 0; overflow: hidden;
  background: var(--paper);
}
.app.left-closed .left { visibility: hidden; }
.brand { display: flex; align-items: stretch; border-bottom: 1px solid var(--border); min-height: 41px; }
.brand-home {
  display: flex; align-items: center; padding: 0 14px; background: var(--ink); color: var(--paper); font-weight: 500;
  transition: background-color .15s, color .15s;
}
.brand-home:hover { background: var(--chartreuse); color: var(--on-accent); }
.brand .spacer { flex: 1; }
.iconbtn { display: inline-flex; align-items: center; justify-content: center; width: 40px; color: var(--soft); }
.iconbtn:hover { color: var(--ink); background: var(--guide); }
.nav { display: grid; padding: 8px 0; border-bottom: 1px solid var(--border); }
.nav button {
  display: flex; align-items: center; gap: 10px; padding: 6px 14px; text-align: left; color: var(--soft);
}
.nav button:hover { color: var(--ink); background: var(--guide); }
.nav button[aria-current="page"] { color: var(--ink); font-weight: 600; box-shadow: inset 3px 0 0 var(--chartreuse); }
.nav .count { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.nav kbd { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.recent { padding: 12px 0; display: grid; gap: 2px; overflow-y: auto; flex: 1; align-content: start; }
.recent .label { padding: 0 14px 6px; }
.recent button { text-align: left; padding: 4px 14px; color: var(--soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.recent button:hover { color: var(--ink); background: var(--guide); }
.left-foot { border-top: 1px solid var(--border); padding: 10px 14px; display: grid; gap: 8px; }
.idx-status { display: grid; gap: 6px; }
.idx-status .bar { height: 3px; background: var(--border); }
.idx-status .bar i { display: block; height: 100%; background: var(--chartreuse); width: 0; }
.hint { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }

/* ---------- Main column ---------- */
.main { display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.topbar { display: flex; align-items: stretch; border-bottom: 1px solid var(--border); min-height: 41px; }
.topbar .addr {
  flex: 1; display: flex; align-items: center; gap: 6px; padding: 0 14px; min-width: 0;
  font-family: var(--font-mono); font-size: 12px; color: var(--muted); overflow: hidden; white-space: nowrap;
}
.topbar .addr b { color: var(--ink); font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
.topbar .iconbtn { border-left: 1px solid var(--border); }
.topbar .iconbtn.first { border-left: 0; border-right: 1px solid var(--border); }
.scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
.page-wrap { max-width: 46rem; margin: 0 auto; padding: 28px 28px 120px; display: grid; gap: 36px; }

/* ---------- Document ---------- */
.doc { display: grid; gap: 10px; min-width: 0; }
.doc.in-feed + .doc.in-feed { border-top: 1px solid var(--border); padding-top: 28px; }
.mistbar {
  display: flex; flex-wrap: wrap; align-items: stretch; border: 1px solid var(--border); font-size: 12px; width: max-content; max-width: 100%;
}
.mistbar > * { padding: 4px 10px; display: flex; align-items: center; gap: 6px; }
.mistbar > * + * { border-left: 1px solid var(--border); }
.mistbar .seg { padding: 0; }
.mistbar .seg button { padding: 4px 10px; color: var(--muted); }
.mistbar .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.mistbar button:hover { color: var(--ink); }
.title-row { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.title {
  font-size: 26px; line-height: 1.2; font-weight: 600; margin: 0; letter-spacing: -0.01em; text-wrap: balance; min-width: 0;
  overflow-wrap: anywhere; flex: 1;
}
.title[contenteditable="true"] { cursor: text; }
.title[contenteditable="true"]:hover { box-shadow: 0 2px 0 var(--border); }
.title.journal-link { text-align: left; }
.title.journal-link:hover { box-shadow: 0 2px 0 var(--chartreuse); }
.in-feed .title { font-size: 20px; }
.weekday { font-family: var(--font-mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.meta .warn { color: var(--coral); }
.menu-wrap { position: relative; }
.menu {
  position: absolute; right: 0; top: 100%; z-index: 30; min-width: 190px; background: var(--surface); border: 1px solid var(--ink);
  display: grid; padding: 4px 0;
}
.menu button { text-align: left; padding: 6px 12px; }
.menu button:hover, .menu button:focus-visible { background: var(--guide); }
.menu .danger { color: var(--coral); }
.title-error { font-size: 12px; color: var(--coral); }

/* ---------- Blocks (the editor) ---------- */
.blocks { display: grid; gap: 2px; font-size: 16px; line-height: 1.6; }
.block {
  --ind: 0; position: relative; display: grid; grid-template-columns: 22px minmax(0, 1fr); align-items: start;
  padding-left: calc(var(--ind) * 24px);
}
.block::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--ind) * 24px); pointer-events: none;
  background-image: repeating-linear-gradient(to right, transparent 0 10px, var(--guide) 10px 11px, transparent 11px 24px);
}
.bullet { height: 25.6px; display: flex; align-items: center; justify-content: center; touch-action: auto; }
.bullet::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
.app.drag-mode.phone .bullet { touch-action: none; cursor: ew-resize; }
.app.drag-mode.phone .bullet::after { width: 8px; height: 8px; background: var(--soft); box-shadow: 0 0 0 4px var(--guide); }
.app.menu-mode.phone .bullet { cursor: pointer; }
.app.menu-mode.phone .bullet::after { width: 8px; height: 8px; }
.content { outline: none; min-height: 25.6px; white-space: pre-wrap; overflow-wrap: anywhere; caret-color: var(--ink); padding-right: 4px; }
.content:empty::before { content: attr(data-ph); color: var(--muted); pointer-events: none; }
.content:focus { background: linear-gradient(to right, var(--guide), transparent 70%); }
.block.is-done .content { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--muted); }
.block.is-done .kw, .block.is-done .link { text-decoration: none; }
.block.dragging { transition: none; }
.block.drag-hint::after { content: attr(data-hint); position: absolute; right: 0; top: 2px; font-family: var(--font-mono); font-size: 11px; color: var(--soft); }

.kw { font-family: var(--font-mono); font-size: 0.78em; font-weight: 600; letter-spacing: 0.04em; }
.kw-TODO { color: var(--coral); }
.kw-DOING { color: var(--on-accent); background: var(--canary); padding: 0 3px; }
.kw-DONE { color: var(--muted); }
.link {
  color: var(--ink); cursor: pointer; text-decoration: underline; text-decoration-color: var(--chartreuse);
  text-decoration-thickness: 2px; text-underline-offset: 3px; border-radius: 0;
}
.link:hover { background: var(--select); }
.link.empty { text-decoration-style: solid; text-decoration-color: var(--border); }
.link.unresolved { color: var(--muted); text-decoration: none; border-bottom: 1.5px dashed var(--muted); }
.link.selected { background: var(--chartreuse); color: var(--on-accent); text-decoration: none; }
.link.journal { font-family: var(--font-mono); font-size: 0.86em; }
.raw { color: var(--soft); font-family: var(--font-mono); font-size: 0.88em; }
.created-hint { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }

/* ---------- Backlinks ---------- */
.backlinks { border-top: 1px solid var(--border); padding-top: 14px; display: grid; gap: 14px; }
.backlinks h3 { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
.dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--canary); box-shadow: 0 0 0 1px var(--on-accent) inset; display: inline-block;
}
.dot-wrap { display: inline-flex; align-items: center; gap: 6px; font-weight: 400; font-size: 12px; color: var(--soft); }
.ref-group { display: grid; gap: 4px; }
.ref-group > button { justify-self: start; font-weight: 600; font-size: 13px; }
.ref-group > button:hover { box-shadow: 0 2px 0 var(--chartreuse); }
.ref-line { padding-left: 14px; border-left: 2px solid var(--border); font-size: 14px; color: var(--soft); white-space: pre-wrap; overflow-wrap: anywhere; }
.empty-note { color: var(--muted); font-size: 13px; }
.rebuild-note {
  font-family: var(--font-mono); font-size: 11px; color: var(--on-accent); background: var(--canary); padding: 4px 8px; justify-self: start;
}

/* ---------- Tasks view ---------- */
.tasks h1 { font-size: 26px; margin: 0; }
.task-group { display: grid; gap: 6px; }
.task-group > button { justify-self: start; font-weight: 600; }
.task-group > button:hover { box-shadow: 0 2px 0 var(--chartreuse); }
.task-row { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 6px; align-items: start; font-size: 15px; }
.task-row input { width: 16px; height: 16px; margin-top: 4px; accent-color: var(--ink); }
.task-row .txt { overflow-wrap: anywhere; white-space: pre-wrap; }
.task-row.done .txt { color: var(--muted); text-decoration: line-through; }
details.done-list summary { cursor: pointer; color: var(--soft); }

/* ---------- Right panel ---------- */
.right { border-left: 1px solid var(--border); display: flex; flex-direction: column; min-width: 0; overflow: hidden; background: var(--paper); }
.app.right-closed .right { visibility: hidden; }
.right-head { display: flex; align-items: center; border-bottom: 1px solid var(--border); min-height: 41px; padding-left: 14px; gap: 8px; }
.right-head .label { flex: 1; }
.right-head .iconbtn { border-left: 1px solid var(--border); align-self: stretch; }
.right .scroll { padding: 0; }
.panel-card { padding: 18px 18px 28px; border-bottom: 1px solid var(--border); display: grid; gap: 10px; }
.panel-card .doc .title { font-size: 20px; }
.panel-card .blocks { font-size: 15px; }
.panel-close { align-self: start; color: var(--muted); }
.panel-close:hover { color: var(--ink); }
.right-empty { padding: 24px 18px; color: var(--muted); }

/* ---------- Popups, palette, toasts ---------- */
.popup {
  position: fixed; z-index: 60; min-width: 240px; max-width: min(360px, calc(100vw - 32px)); background: var(--surface);
  border: 1px solid var(--ink); padding: 4px 0; margin: 0; list-style: none; font-size: 14px;
}
.popup li { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 5px 12px; cursor: pointer; }
.popup li[aria-selected="true"] { background: var(--chartreuse); color: var(--on-accent); }
.popup li[aria-selected="true"] .sub { color: var(--on-accent); }
.popup .sub { font-family: var(--font-mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
.popup .head { font-family: var(--font-mono); font-size: 11px; color: var(--muted); padding: 4px 12px 2px; cursor: default; }
.popup .new { font-weight: 600; }
.popup .none { color: var(--muted); cursor: default; }

.scrim { position: absolute; inset: 0; background: rgba(0,0,0,0.28); z-index: 40; }
.palette {
  position: absolute; z-index: 50; left: 50%; top: 72px; transform: translateX(-50%); width: min(560px, calc(100% - 32px));
  background: var(--surface); border: 1px solid var(--ink); display: grid;
}
.palette input {
  font: inherit; font-size: 16px; padding: 12px 14px; border: 0; border-bottom: 1px solid var(--border); background: transparent; color: var(--ink); outline: none;
}
.palette ul { list-style: none; margin: 0; padding: 4px 0; max-height: 50vh; overflow-y: auto; }
.palette li { padding: 6px 14px; cursor: pointer; display: grid; gap: 2px; }
.palette li[aria-selected="true"] { background: var(--chartreuse); color: var(--on-accent); }
.palette li[aria-selected="true"] .snip, .palette li[aria-selected="true"] .sub { color: var(--on-accent); }
.palette .group { font-family: var(--font-mono); font-size: 11px; color: var(--muted); padding: 8px 14px 2px; cursor: default; }
.palette .snip { font-size: 13px; color: var(--soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.palette mark { background: var(--canary); color: var(--on-accent); }
.palette .foot { border-top: 1px solid var(--border); padding: 6px 14px; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }

.toasts { position: absolute; z-index: 70; left: 50%; bottom: 20px; transform: translateX(-50%); display: grid; gap: 6px; width: max-content; max-width: calc(100% - 32px); }
.toast { background: var(--ink); color: var(--paper); padding: 8px 12px; display: flex; gap: 14px; align-items: center; font-size: 13px; }
.toast button { color: var(--chartreuse); font-weight: 600; }

/* ---------- Phone ---------- */
.app.phone { grid-template-columns: minmax(0, 1fr); }
.app.phone .left {
  position: absolute; z-index: 45; top: 0; bottom: 0; left: 0; width: min(300px, 84%); visibility: visible;
  transform: translateX(-102%); transition: transform .2s ease; border-right: 1px solid var(--ink);
}
.app.phone.drawer-open .left { transform: none; }
.app.phone .right {
  position: absolute; z-index: 44; inset: 0; visibility: visible; transform: translateX(102%); transition: transform .2s ease; border-left: 0;
}
.app.phone.sheet-open .right { transform: none; }
.app.phone .page-wrap { padding: 18px 16px 140px; gap: 28px; }
.app.phone .title { font-size: 22px; }
.app.phone .blocks { font-size: 16px; }
.app.phone .block { padding-left: calc(var(--ind) * 18px); }
.app.phone .block::before { width: calc(var(--ind) * 18px); background-image: repeating-linear-gradient(to right, transparent 0 8px, var(--guide) 8px 9px, transparent 9px 18px); }
.app:not(.phone) .phone-only { display: none !important; }
.app.phone .desk-only { display: none !important; }

.ptool {
  position: absolute; z-index: 35; left: 0; right: 0; bottom: 0; display: flex; border-top: 1px solid var(--ink); background: var(--surface);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.ptool button { flex: 1; min-height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 10px; color: var(--soft); }
.ptool button + button { border-left: 1px solid var(--border); }
.ptool button:active { background: var(--chartreuse); color: var(--on-accent); }
.ptool b { font-family: var(--font-mono); font-size: 14px; color: var(--ink); font-weight: 500; }
.sheet {
  position: absolute; z-index: 48; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--ink);
  display: grid; padding-bottom: env(safe-area-inset-bottom, 0px);
}
.sheet .label { padding: 10px 16px 4px; }
.sheet button { text-align: left; padding: 12px 16px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; }
.sheet button:active { background: var(--chartreuse); color: var(--on-accent); }
.sheet .k { font-family: var(--font-mono); color: var(--muted); font-size: 12px; }

/* ---------- Prototype controls ---------- */
.proto-btn {
  position: fixed; z-index: 80; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--paper); padding: 8px 12px; font-family: var(--font-mono); font-size: 12px; display: flex; gap: 8px; align-items: center;
}
.proto-btn:hover { background: var(--chartreuse); color: var(--on-accent); }
.proto-btn .n { background: var(--chartreuse); color: var(--on-accent); padding: 0 5px; }
.proto-panel {
  position: fixed; z-index: 90; top: calc(12px + env(safe-area-inset-top, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  right: calc(12px + env(safe-area-inset-right, 0px)); width: min(400px, calc(100vw - 24px)); background: var(--surface);
  border: 1px solid var(--ink); display: flex; flex-direction: column;
}
.proto-head { display: flex; align-items: center; border-bottom: 1px solid var(--border); padding-left: 16px; min-height: 44px; }
.proto-head h2 { flex: 1; margin: 0; font-size: 14px; }
.proto-head .iconbtn { align-self: stretch; border-left: 1px solid var(--border); }
.proto-body { overflow-y: auto; padding: 16px; display: grid; gap: 22px; align-content: start; }
.proto-body p { margin: 0; color: var(--soft); }
.proto-sec { display: grid; gap: 8px; }
.proto-sec h3 { margin: 0; font-size: 13px; }
.try { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.try label { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 8px; align-items: start; padding: 5px 0; cursor: pointer; }
.try input { margin-top: 3px; accent-color: var(--ink); }
.try .f { font-family: var(--font-mono); font-size: 10px; color: var(--muted); padding-top: 3px; white-space: nowrap; }
.choice .decided { background: var(--chartreuse); color: var(--on-accent); font-family: var(--font-mono); font-size: 10px; padding: 0 4px; margin-left: 6px; }
.try .remind { background: var(--canary); color: var(--on-accent); font-family: var(--font-mono); font-size: 10px; padding: 0 4px; margin-left: 4px; }
.try li.done span { color: var(--muted); }
.choice { border: 1px solid var(--border); margin: 0; padding: 10px 12px; display: grid; gap: 6px; }
.choice legend { font-weight: 600; padding: 0 4px; font-size: 13px; }
.choice label { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 6px; align-items: start; cursor: pointer; }
.choice input { margin-top: 3px; accent-color: var(--ink); }
.choice small { display: block; color: var(--muted); font-size: 12px; }
.choice .q { font-family: var(--font-mono); font-size: 10px; color: var(--muted); }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 1px solid var(--ink); padding: 6px 10px; font-size: 13px; }
.btn:hover { background: var(--chartreuse); color: var(--on-accent); border-color: var(--chartreuse); }
.keys { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: 12px; }
.keys kbd { font-family: var(--font-mono); font-size: 11px; color: var(--ink); }
.keys span { color: var(--soft); }

    var s = ui.sheetCtx; ui.sheetCtx = null; renderPhoneExtras();
    if (!s || a === "close-sheet-menu") return;
    var el = colRoot(s.col).querySelector('.content[data-page="' + s.page + '"][data-i="' + s.i + '"]');
    if (!el) return;
    el.focus(); setCaret(el, toUnits(state.pages[s.page].lines[s.i].text).length);
    var cx = ctxOf(el);
    if (a === "indent") doIndent(cx, 1);
    else if (a === "outdent") doIndent(cx, -1);
    else if (a === "task") doTask(cx);
    else if (a === "link") insertAtCaret(cx, "[[");
    else if (a === "date") insertAtCaret(cx, dateAt() ? "@" : "[[");
  }

  // Drag a bullet sideways to indent or outdent (phone option)
  var drag = null;
  function onPointerDown(e) {
    var b = e.target.closest && e.target.closest(".bullet");
    if (!b || !isPhone() || opts.phone !== "drag") return;
    e.preventDefault();
    var block = b.parentElement;
    drag = { x: e.clientX, block: block, el: block.querySelector(".content"), dx: 0 };
    block.classList.add("dragging");
    try { b.setPointerCapture(e.pointerId); } catch (err) { /* older browsers */ }
  }
  function onPointerMove(e) {
    if (!drag) return;
    drag.dx = Math.max(-60, Math.min(60, e.clientX - drag.x));
    drag.block.style.transform = "translateX(" + Math.round(drag.dx / 2) + "px)";
    drag.block.classList.toggle("drag-hint", Math.abs(drag.dx) > 28);
    drag.block.setAttribute("data-hint", drag.dx > 0 ? "indent" : "outdent");
  }
  function onPointerUp() {
    if (!drag) return;
    var d = drag; drag = null;
    d.block.style.transform = ""; d.block.classList.remove("dragging", "drag-hint");
    if (Math.abs(d.dx) > 28) {
      var cx = ctxOf(d.el);
      if (indentLine(cx.page, cx.i, d.dx > 0 ? 1 : -1)) { rerenderPage(cx.page.id); markEdited(cx.page.id); tick("phone"); }
    }
  }

  // Task checkboxes in the Tasks view
  function onChange(e) {
    var cb = e.target;
    if (!cb.hasAttribute || !cb.hasAttribute("data-task")) return;
    var p = state.pages[cb.getAttribute("data-task")], i = +cb.getAttribute("data-i"), t = p.lines[i].text;
    p.lines[i].text = cb.checked ? t.replace(/^(TODO|DOING)/, "DONE") : t.replace(/^DONE/, "TODO");
    rerenderPage(p.id);
    var tv = mainEl.querySelector(".tasks"); if (tv) tv.replaceWith(tasksView());
    renderLeft();
    scheduleSave();
    toast((cb.checked ? "Marked done in “" : "Reopened in “") + titleOf(p) + "”");
    tick("tasks-view");
  }

  // ---------- Prototype controls ----------
  var TRY = [
    { id: "bullets", f: "F7", t: "In today's journal, type a line, press Enter for the next bullet, then Tab and Shift+Tab to nest. Backspace on an empty bullet outdents it." },
    { id: "indent", f: "F7", t: "Tab a line that has children (Mistlog page) and watch them move with it." },
    { id: "task", f: "F6", t: MOD + "+Enter on a line cycles TODO → DOING → DONE → plain." },
    { id: "link", f: "F3", t: "Type [[ and pick a page, or type a new title and press ] to create an empty page." },
    { id: "linkedit", f: "6.1", t: "Put the cursor right after a link and press Backspace to reopen it. Pick another page, or press Esc to put the original back." },
    { id: "paste", f: "6.1", t: "Paste text containing [[Reading list]] and see it become a link." },
    { id: "date", f: "F20", t: "Type @next fri or [[in 2 weeks. Switch “Date trigger” below to compare." },
    { id: "rename", f: "F5", t: "Open Mistlog, click its title and rename it. Every link updates; the old address redirects." },
    { id: "unique", f: "F2", t: "Rename a page to “Reading list” to see the unique-title rule." },
    { id: "side", f: "F18", t: MOD + "+click any link to open it in the side panel." },
    { id: "search", f: "F13", t: MOD + "+K to search titles and text, then create a page from the last row." },
    { id: "tasks-view", f: "F6", t: "Open Tasks and tick a task. The line on its page changes." },
    { id: "delete", f: "6.1", t: "Delete “Weekly review” from its ⋯ menu. Links go dashed; click one to restore." },
    { id: "panels", f: "F8", t: "Press t l and t r (outside the editor) to hide and show the panels." },
    { id: "rebuild", f: "Index", t: "Run an index rebuild (below) and look at the sidebar, backlinks, Tasks and search." },
    { id: "phone", f: "F17", t: "Switch View to Phone frame, open the menu, and try each phone control option." }
  ];
  var CHOICES = [
    { key: "linkEdit", label: "Editing a link", q: "PRD 6.1", opts: [
      ["reopen", "Reopen for editing", "Backspace turns the link back into [[Title]] with suggestions open, like Logseq. Esc puts the original link back."],
      ["unit", "One unit", "Backspace selects the whole link, a second Backspace deletes it. To point elsewhere, delete and retype."]], decided: "reopen" },
    { key: "dateTrigger", label: "Date trigger", q: "PRD 6.2", opts: [
      ["at", "@ prefix", "Type @ then a phrase: @tomorrow, @next fri, @oct 31."],
      ["brackets", "Inside [[ ]]", "Dates appear among page suggestions: [[in 2 weeks."],
      ["both", "Both", "Either way works."]], decided: "both" },
    { key: "feedHeader", label: "Mist header in the journal feed", q: "F1, revisit after M2", opts: [
      ["hidden", "Hidden per day", "Shown when you open a day on its own."],
      ["shown", "Shown on every day", "Edit/Suggest, Comments and Share above each day."]], decided: "shown" },
    { key: "phone", label: "Phone controls", q: "F17", opts: [
      ["toolbar", "Keyboard toolbar", "A bar of indent, outdent, task, link and date buttons while you type."],
      ["menu", "Bullet menu", "Tap a bullet for a menu of line actions."],
      ["drag", "Drag the bullet", "Drag a bullet right to indent, left to outdent."]], decided: "toolbar" },
    { key: "view", label: "View", q: "", opts: [
      ["desktop", "Desktop", "Full width."],
      ["phone", "Phone frame", "A 390px phone-sized frame. On a real phone this is automatic."]] }
  ];
  var protoPanel = document.getElementById("protoPanel"), protoBtn = document.getElementById("protoBtn");
  function tick(id) {
    if (opts.tried[id]) return;
    opts.tried[id] = true; persist(OKEY, opts);
    if (!protoPanel.hidden) renderProto(); else renderProtoBtn();
  }
  function renderProtoBtn() {
    var n = TRY.filter(function (t) { return opts.tried[t.id]; }).length;
    protoBtn.textContent = "";
    protoBtn.append("Prototype controls", h("span", { class: "n" }, n + "/" + TRY.length));
  }
  function renderProto() {
    renderProtoBtn();
    protoPanel.textContent = "";
    var body = h("div", { class: "proto-body" },
      h("p", null, "A clickable mock of Mistlog's M2 interactions, built on Mist's look. It is the interaction reference for building M2: match its behaviour, not its code. Notes are sample data saved in this browser only."));
    var list = h("ol", { class: "try" });
    TRY.forEach(function (t) {
      var id = "try-" + t.id;
      list.append(h("li", { class: opts.tried[t.id] ? "done" : null },
        h("label", { for: id },
          h("input", { type: "checkbox", id: id, checked: !!opts.tried[t.id], "data-try": t.id }),
          h("span", null, t.t, t.remind ? h("span", { class: "remind" }, "decide") : null),
          h("span", { class: "f" }, t.f))));
    });
    body.append(h("div", { class: "proto-sec" }, h("h3", null, "Things to try"), list));
    var ch = h("div", { class: "proto-sec" }, h("h3", null, "Choices"), h("p", null, "Defaults follow the decisions recorded in the PRD on 22 Oct 2026. Switch to see the alternatives that were considered."));
    CHOICES.forEach(function (c) {
      var fs = h("fieldset", { class: "choice" }, h("legend", null, c.label, c.q ? " " : null, c.q ? h("span", { class: "q" }, c.q) : null));
      c.opts.forEach(function (o) {
        var id = "opt-" + c.key + "-" + o[0];
        fs.append(h("label", { for: id },
          h("input", { type: "radio", name: "opt-" + c.key, id: id, value: o[0], checked: opts[c.key] === o[0], "data-opt": c.key }),
          h("span", null, o[1], c.decided === o[0] ? h("span", { class: "decided" }, "decided") : null, h("small", null, o[2]))));
      });
      ch.append(fs);
    });
    body.append(ch);
    body.append(h("div", { class: "proto-sec" }, h("h3", null, "Simulate"),
      h("div", { class: "btnrow" },
        h("button", { class: "btn", type: "button", "data-proto": "rebuild" }, "Run an index rebuild"),
        h("button", { class: "btn", type: "button", "data-proto": "reset" }, "Reset sample notes"))));
    var keys = h("div", { class: "keys" });
    [["Enter", "New bullet at the same level"], ["Tab / Shift+Tab", "Indent / outdent with children"], ["Backspace", "On an empty bullet: outdent, then remove"],
      [MOD + "+Enter", "Cycle TODO → DOING → DONE"], ["[[", "Link to a page"], ["@", "Link to a date"], ["Alt+Enter", "Open the link before the cursor"],
      [MOD + "+click", "Open in side panel"], [MOD + "+K", "Search"], ["t l / t r", "Toggle panels"], ["?", "These controls"]]
      .forEach(function (k) { keys.append(h("kbd", null, k[0]), h("span", null, k[1])); });
    body.append(h("div", { class: "proto-sec" }, h("h3", null, "Keys"), keys));
    protoPanel.append(h("div", { class: "proto-head" }, h("h2", null, "Prototype controls"),
      h("button", { class: "iconbtn", type: "button", "data-proto": "close", "aria-label": "Close prototype controls" }, icon("x"))), body);
  }
  function toggleProto(show) {
    protoPanel.hidden = !show;
    protoBtn.setAttribute("aria-expanded", String(show));
    if (show) { renderProto(); var c = protoPanel.querySelector("[data-proto='close']"); if (c) c.focus(); }
    else protoBtn.focus();
  }
  protoBtn.addEventListener("click", function () { toggleProto(protoPanel.hidden); });
  protoPanel.addEventListener("click", function (e) {
    var b = e.target.closest("[data-proto]"); if (!b) return;
    var a = b.getAttribute("data-proto");
    if (a === "close") toggleProto(false);
    if (a === "rebuild") { startRebuild(); tick("rebuild"); }
    if (a === "reset") { state = seed(); ui.sheet = false; closePopup(); renderAll(); toast("Sample notes reset"); }
  });
  protoPanel.addEventListener("change", function (e) {
    var t = e.target;
    if (t.hasAttribute("data-opt")) {
      opts[t.getAttribute("data-opt")] = t.value; persist(OKEY, opts);
      closePopup(); clearPendingDel(); ui.sheetCtx = null;
      renderAll();
      if (t.getAttribute("data-opt") === "view" && t.value === "phone") tick("phone");
    }
    if (t.hasAttribute("data-try")) { opts.tried[t.getAttribute("data-try")] = t.checked; persist(OKEY, opts); renderProto(); }
  });

  // ---------- Wire up ----------
  document.addEventListener("input", onInput);
  document.addEventListener("keydown", onKeydown);
  document.addEventListener("paste", onPaste);
  document.addEventListener("click", onClick);
  document.addEventListener("change", onChange);
  document.addEventListener("pointerdown", onPointerDown);
  document.addEventListener("pointermove", onPointerMove);
  document.addEventListener("pointerup", onPointerUp);
  document.addEventListener("pointercancel", onPointerUp);
  document.addEventListener("compositionend", function (e) { if (e.target.classList && e.target.classList.contains("content")) onInput({ target: e.target }); });
  popupEl.addEventListener("mousedown", function (e) {
    var li = e.target.closest("li[data-k]"); if (!li) return;
    e.preventDefault(); choose(lastItems[+li.getAttribute("data-k")]);
  });
  document.addEventListener("focusin", function (e) {
    var t = e.target;
    if (t.classList && t.classList.contains("content")) {
      ui.editing = t;
      if (isPhone()) renderPhoneExtras();
    }
  });
  document.addEventListener("focusout", function (e) {
    var t = e.target;
    if (t.hasAttribute && t.hasAttribute("data-title")) onTitleBlur(t);
    if (t.classList && t.classList.contains("content")) {
      setTimeout(function () {
        var a = document.activeElement;
        if (!(a && a.classList && a.classList.contains("content"))) {
          if (lm && lm.orig) cancelReopen(); else if (lm || dm) closePopup();
          if (isPhone() && !(a && a.closest && a.closest(".ptool,.sheet"))) { ui.editing = null; renderPhoneExtras(); }
        }
      }, 120);
    }
  });
  window.addEventListener("resize", function () { applyLayout(); renderPhoneExtras(); hidePopup(); });

  state = load(KEY) || seed();
  ensureJournal(ymd(today0()));
  opts = Object.assign({}, DEFAULT_OPTS, load(OKEY) || {});
  opts.tried = opts.tried || {};
  renderAll();
  renderProtoBtn();
})();
</script>
</body>
</html>
